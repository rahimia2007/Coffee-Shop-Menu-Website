<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind link -->
    <link href="./asset/styles/output.css" rel="stylesheet" />
    <title>Ember & Oak</title>
  </head>
  <body class="bg-background text-primary-text font-dmsans">
    <!-- HEADER -->
    <header
      class="fixed top-0 inset-x-0 z-40 border-b border-primary/15 bg-background/90 backdrop:blur-[14px] h-16"
    >
      <div class="container flex items-center justify-between h-full">
        <!-- LOGO -->
        <div
          class="flex items-center gap-2.5 hover:opacity-75 transition-opacity cursor-pointer"
        >
          <div
            class="size-7 rounded-lg flex items-center justify-center bg-primary"
          >
            <i data-lucide="coffee" class="w-4 h-4 text-background"></i>
          </div>
          <span class="text-lg font-Playfair font-bold tracking-tigh"
            >Ember & Oak</span
          >
        </div>

        <!-- Nav Menu -->
        <nav class="hidden md:block">
          <ul class="flex items-center gap-8">
            <li>
              <a
                class="text-sm tracking-wide transition-colors text-primary cursor-pointer"
                href="./index.html"
                >Home</a
              >
            </li>
            <li>
              <a
                class="text-sm tracking-wide transition-colors text-secondary-text hover:text-primary cursor-pointer"
                href="#"
                >Menu</a
              >
            </li>
            <li>
              <a
                class="text-sm tracking-wide transition-colors text-secondary-text hover:text-primary cursor-pointer"
                href="#"
                >Our Story</a
              >
            </li>
          </ul>
        </nav>

        <!-- Buttons -->
        <div class="flex items-center justify-center gap-3">
          <!-- Cart BTN -->
          <div
            class="flex items-center justify-center bg-primary text-background gap-2 px-4 py-2 rounded-full text-sm font-semibold transition-all hover:opacity-85 hover:scale-95 cursor-pointer"
          >
            <i data-lucide="shopping-cart" class="w-4 h-4 text-background"></i>
            <span class="hidden sm:block">Cart</span>
          </div>

          <!-- Menu Mobile Toggle -->
          <div
            id="menu-toggle"
            class="md:hidden size-9 flex items-center justify-center text-secondary-text rounded-xl border border-primary/14 transition-colors cursor-pointer"
          >
            <i data-lucide="menu" class="w-4 h-4"></i>
          </div>
        </div>

        <!-- Mobile Nav Menu -->
        <nav
          id="mobile-nav"
          class="fixed top-16 inset-x-0 px-6 py-4 md:hidden border-b border-primary/15 h-0 opacity-0 overflow-hidden transition-all duration-300"
        >
          <ul class="flex flex-col gap-2">
            <li
              class="flex items-center justify-between px-4 py-3 transition-all text-primary bg-primary/5 rounded-xl cursor-pointer"
            >
              <a
                class="w-full block text-left text-sm tracking-wide"
                href="./index.html"
                >Home</a
              >
              <span class="w-1.5 h-1.5 rounded-full bg-primary block"></span>
            </li>
            <li
              class="flex items-center justify-between px-4 py-3 transition-all duration-300 text-secondary-text hover:text-primary hover:bg-primary/5 rounded-xl group cursor-pointer"
            >
              <a class="w-full block text-left text-sm tracking-wide" href="#"
                >Menu</a
              >
              <span
                class="w-1.5 h-1.5 rounded-full bg-primary hidden group-hover:block"
              ></span>
            </li>
            <li
              class="flex items-center justify-between px-4 py-3 transition-all duration-300 text-secondary-text hover:text-primary hover:bg-primary/5 rounded-xl group cursor-pointer"
            >
              <a class="w-full block text-left text-sm tracking-wide" href="#"
                >Our Story</a
              >
              <span
                class="w-1.5 h-1.5 rounded-full bg-primary hidden group-hover:block"
              ></span>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="mt-16">

      <!-- Hero -->
      <section
        class="relative z-10 text-center h-[90vh] border-b border-primary/15"
      >
        <div
          class="px-6 max-w-3xl mx-auto flex items-center justify-center flex-col h-full"
        >
          <span
            class="text-xs text-primary tracking-[0.36em] uppercase mb-6 font-dmmono block"
            >Specialty Coffee · Logan Square, Chicago</span
          >

          <h1
            class="text-6xl md:text-8xl font-bold leading-[1.05] mb-6 font-Playfair"
          >
            Where Every <br />
            <span class="text-primary italic">Sip</span> Matters
          </h1>

          <p
            class="text-base md:text-lg max-w-sm mx-auto mb-10 leading-relaxed text-secondary-text"
          >
            Artisan-roasted beans, crafted with intention. Sourced ethically,
            brewed obsessively.
          </p>

          <a
            href=""
            class="inline-flex items-center gap-3 px-8 py-4 rounded-full text-background bg-primary shadow-[0px_0px_40px] shadow-primary/35 text-sm font-semibold tracking-wide transition-all hover:scale-105 active:scale-95"
            >Explore Menu <span>→</span></a
          >

          <div
            class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1.5 opacity-35"
          >
            <div
              class="w-px h-8 bg-linear-to-b from-transparent to-primary-text"
            ></div>
            <span
              class="text-xs tracking-widest uppercase font-dmmono text-primary-text"
              >Scroll</span
            >
          </div>
        </div>
      </section>
    </main>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
      lucide.createIcons();
    </script>

    <script src="./asset/js/script.js"></script>
  </body>
</html>
